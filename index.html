<!doctype html>
<html lang="et">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Allese.ee - Loading...</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #000000; /* Puhas must taust */
        color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .container {
        padding: 20px;
      }
      h1 {
        font-size: 2.5rem;
        margin-bottom: 15px;
        opacity: 0;
        animation: fadeIn 1s ease-in forwards;
      }
      p {
        font-size: 1.1rem;
        margin-bottom: 30px;
        color: #aaaaaa;
        opacity: 0;
        animation: fadeIn 1s ease-in 0.5s forwards;
      }
      /* Laadimisanimatsioon */
      .loader {
        width: 50px;
        height: 50px;
        border: 5px solid #333333;
        border-top: 5px solid #e43f5a;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto;
        opacity: 0;
        animation:
          fadeIn 1s ease-in 1s forwards,
          spin 1s linear infinite 1s;
      }

      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>allese.ee</h1>
      <p>Sisu laadimine...</p>
      <!-- Laadimisrõngas -->
      <div class="loader"></div>
    </div>
  </body>
</html>
