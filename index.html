<!doctype html>
<html lang="et">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Allese.ee - Leht on tegemisel</title>
    <style>
      body {
        background-color: #121212;
        color: #ffffff;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
      }
      p {
        color: #aaaaaa;
        margin-bottom: 20px;
      }
      .loading-container {
        width: 300px;
        height: 10px;
        background-color: #333;
        border-radius: 5px;
        overflow: hidden;
        margin-bottom: 30px;
      }
      .loading-bar {
        height: 100%;
        width: 0;
        background-color: #007bff;
        animation: load 3s infinite ease-in-out;
      }
      @keyframes load {
        0% {
          width: 0;
        }
        50% {
          width: 100%;
        }
        100% {
          width: 0;
        }
      }
      .btn {
        background-color: #007bff;
        color: white;
        padding: 12px 24px;
        text-decoration: none;
        border-radius: 5px;
        font-weight: bold;
        transition: background-color 0.2s;
      }
      .btn:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <h1>Leht on tegemisel</h1>
    <p>Haldab: Andre Allese</p>
    <div class="loading-container">
      <div class="loading-bar"></div>
    </div>
    <a href="mailto:andreallese@gmail.com" class="btn">Võta ühendust</a>
  </body>
</html>
